name: FlightDeck
options:
  bundleIdPrefix: app.flightdeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages: {}

targets:
  FlightDeck:
    type: application
    platform: iOS
    sources:
      - path: FlightDeck
        excludes:
          - "**/*.md"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.flightdeck.crew
        INFOPLIST_FILE: FlightDeck/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FlightDeck/FlightDeck.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: false
    entitlements:
      path: FlightDeck/FlightDeck.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.flightdeck.crew
    dependencies:
      - target: FlightDeckWidget
        embed: true

  FlightDeckWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FlightDeckWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.flightdeck.crew.widget
        INFOPLIST_FILE: FlightDeckWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: FlightDeckWidget/FlightDeckWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: FlightDeckWidget/FlightDeckWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.flightdeck.crew

schemes:
  FlightDeck:
    build:
      targets:
        FlightDeck: all
        FlightDeckWidget: all
    run:
      config: Debug
    archive:
      config: Release
